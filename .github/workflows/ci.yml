name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Types, lint et tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier les types
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test -- --ci

      # Les tables d'animation sont générées depuis le firmware de la réplique.
      # On vérifie ici qu'elles restent cohérentes, sans accès au dépôt matériel.
      - name: Vérifier la configuration Expo
        run: npx expo config --type public > /dev/null
